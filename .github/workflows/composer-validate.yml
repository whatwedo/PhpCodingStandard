name: Composer Validate

# Checks that composer.json is valid and publishable, treating warnings as
# errors, so a broken manifest does not reach a release.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  composer-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      # composer.lock is not committed, so there is no lock file to check
      - run: composer validate --strict --no-check-lock
