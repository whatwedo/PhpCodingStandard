name: Workflow Lint

# Checks the GitHub Actions workflows themselves: actionlint for syntax, expression
# and shell errors, zizmor for security weaknesses such as script injection, broad
# token permissions or actions not pinned to a commit. The release workflow can
# write to the repository, so a weakness here weighs more than one in the code.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          # Report as annotations on the pull request instead of uploading SARIF to
          # code scanning, which would need the security-events permission
          advanced-security: false
          annotations: true
          # A new zizmor release can bring new audits, so it moves in a reviewed update
          version: 1.32.0
